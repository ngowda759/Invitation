name: Bootstrap Invitation AI Loop v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Invitation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import and adapt the proven loop engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _badminton-loop-source
          test -f .github/workflows/bootstrap-invitation-loop-v5.yml
          git clone --depth 1 https://github.com/ngowda759/Badminton.git _badminton-loop-source

          mkdir -p .ai/scripts .ai/prompts .ai/schemas .ai/templates .ai/tests docs/tasks .ai/state

          cp -R _badminton-loop-source/.ai/scripts/. .ai/scripts/
          cp -R _badminton-loop-source/.ai/prompts/. .ai/prompts/
          cp -R _badminton-loop-source/.ai/schemas/. .ai/schemas/
          cp -R _badminton-loop-source/.ai/templates/. .ai/templates/

          for f in ai-loop-implement.yml ai-loop-review.yml ai-loop-next-task.yml ai-loop-merge-gate.yml ai-loop-validate.yml; do
            cp "_badminton-loop-source/.github/workflows/$f" ".github/workflows/$f"
          done

          # Adapt only the imported engine. The bootstrap file itself is intentionally
          # allowed to retain the source-repository URL used by this one-time import.
          find .ai .github/workflows -type f \
            ! -name 'bootstrap-invitation-loop-v5.yml' \
            \( -name '*.mjs' -o -name '*.json' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' \) \
            -print0 |
            while IFS= read -r -d '' file; do
              perl -0pi -e 's/Badminton/Invitation/g; s/AI-([0-9][0-9]*)/INV-$1/g; s/AI-/INV-/g' "$file"
            done < <(find .ai .github/workflows -type f \
              ! -name 'bootstrap-invitation-loop-v5.yml' \
              \( -name '*.mjs' -o -name '*.json' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' \) \
              -print0)

          rm -rf _badminton-loop-source

      - name: Write Invitation loop configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > .ai/loop.config.json <<'JSON'
          {
            "version": 1,
            "loopId": "INV-001",
            "maxReviewRounds": 3,
            "baseBranch": "main",
            "branchPrefix": "automation/",
            "ciWorkflow": "CI",
            "ciWorkflowFile": ".github/workflows/ci.yml",
            "requiredChecks": [
              "Lint, typecheck, test, build",
              "Invitation AntiSlop"
            ],
            "protectedPaths": [
              ".github/workflows/**",
              ".env",
              ".env.*",
              "docs/PRODUCT.md",
              "docs/ARCHITECTURE.md",
              "docs/DESIGN-SYSTEM.md",
              "docs/PHASES.md",
              "docs/QUALITY-GATES.md",
              "docs/AGENT-CONTRACT.md"
            ],
            "secrets": {
              "required": [
                "OPENHANDS_API_KEY",
                "OPENROUTER_API_KEY"
              ],
              "optional": [
                "OPENHANDS_HOST",
                "OPENROUTER_REVIEW_MODEL"
              ]
            },
            "review": {
              "provider": "openrouter",
              "endpoint": "https://openrouter.ai/api/v1",
              "model": "openrouter/free",
              "apiKeyEnvVar": "OPENROUTER_API_KEY",
              "modelEnvVar": "OPENROUTER_REVIEW_MODEL",
              "schema": ".ai/schemas/review-report.schema.json",
              "markerName": "ai-loop-review",
              "commentOnEveryRound": true
            },
            "mergeGate": {
              "enabled": true,
              "requireCiGreen": true,
              "requireReviewPassed": true,
              "requireHumanApproval": false
            },
            "reviewers": {
              "architect": "ChatGPT",
              "implementer": "OpenHands",
              "reviewer": "OpenRouter",
              "qualityGate": "Invitation AntiSlop",
              "ci": "GitHub Actions",
              "merge": "GitHub Actions"
            },
            "automation": {
              "enabled": true,
              "autoAdvanceTasks": true,
              "autoMerge": true,
              "maxConcurrentTasks": 1,
              "nextTaskEnabled": true,
              "stopOnHumanReviewRequired": true,
              "stopOnProtectedPath": true,
              "triggerLabel": "ai-task",
              "reviewLabel": "ai-review",
              "blockedLabel": "ai-blocked",
              "readyLabel": "ai-ready",
              "nextTaskBranchPrefix": "automation/next-task-",
              "mergeMethod": "squash",
              "useNativeAutoMerge": true
            },
            "limits": {
              "maxChangedFiles": 60,
              "maxDiffLines": 2500
            },
            "paths": {
              "state": ".ai/state/loop-state.json",
              "queue": ".ai/state/task-queue.json",
              "reviewLog": ".ai/state/review-log.jsonl",
              "taskDocs": "docs/tasks"
            }
          }
          JSON

      - name: Write Invitation initial task and state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai/state docs/tasks

          : > .ai/state/review-log.jsonl

          cat > docs/tasks/INV-001.md <<'EOF'
          # INV-001 — Initialize Application Foundation

          ## Objective
          Establish the production-ready Next.js foundation for Invitation without implementing later invitation experiences.

          ## Scope
          - Next.js App Router + TypeScript.
          - Tailwind CSS and the agreed UI foundation.
          - Documented project structure.
          - ESLint/formatting.
          - Vitest and Playwright foundations.
          - Responsive base layout.
          - Metadata/SEO foundation.
          - GitHub CI for lint, typecheck, test and build.

          ## Acceptance criteria
          - The application starts and builds successfully.
          - TypeScript, lint, unit-test and browser-test foundations are wired.
          - CI validates lint, typecheck, test and build.
          - Mobile-first layout foundation exists.
          - No database, authentication, Rayaramathaynk runtime dependency, Raya AI, or later-phase invitation feature is introduced.
          - No fabricated temple-specific content is introduced.
          - The implementation is submitted through a PR and does not write directly to `main`.

          ## Out of scope
          - Hero experience.
          - Programme/event content.
          - Temple map.
          - Gallery.
          - Seva content.
          - Audio.
          - Backend/API.
          - Authentication.
          - Database.

          ## Validation
          - `npm run lint`
          - `npm run typecheck`
          - `npm test`
          - `npm run build`
          - Playwright smoke test if configured.

          ## References
          - `docs/PRODUCT.md`
          - `docs/ARCHITECTURE.md`
          - `docs/DESIGN-SYSTEM.md`
          - `docs/PHASES.md`
          - `docs/QUALITY-GATES.md`
          - `docs/AGENT-CONTRACT.md`
          EOF

          cat > .ai/state/task-queue.json <<'JSON'
          {
            "version": 1,
            "updatedAt": "2026-10-04T00:00:00Z",
            "tasks": [
              {
                "id": "INV-001",
                "title": "Initialize Application Foundation",
                "phase": "P1 Foundation",
                "status": "approved",
                "summary": "Initialize the Invitation application foundation according to the project constitution.",
                "acceptanceCriteria": [
                  "Next.js App Router + TypeScript foundation exists.",
                  "Tailwind CSS and the agreed UI foundation are configured.",
                  "The documented project structure exists.",
                  "Lint, typecheck, tests and build are wired into CI.",
                  "No database, authentication, Rayaramathaynk runtime dependency, or later-phase experience is introduced."
                ],
                "outOfScope": [
                  "Hero experience",
                  "Programme/event content",
                  "Temple map",
                  "Gallery",
                  "Seva content",
                  "Audio",
                  "Backend/API",
                  "Authentication",
                  "Database"
                ],
                "humanApproval": false,
                "dependsOn": [],
                "references": [
                  "docs/PRODUCT.md",
                  "docs/ARCHITECTURE.md",
                  "docs/DESIGN-SYSTEM.md",
                  "docs/PHASES.md",
                  "docs/QUALITY-GATES.md",
                  "docs/AGENT-CONTRACT.md"
                ],
                "createdAt": "2026-10-04T00:00:00Z"
              }
            ]
          }
          JSON

          cat > .ai/state/loop-state.json <<'JSON'
          {
            "version": 1,
            "loopId": "INV-001",
            "status": "next-task",
            "round": 0,
            "maxReviewRounds": 3,
            "currentTaskId": null,
            "currentPr": null,
            "lastVerdict": null,
            "lastCiStatus": null,
            "reviewedHeadSha": null,
            "blockedReason": null,
            "completedTasks": [],
            "updatedAt": "2026-10-04T00:00:00Z",
            "history": [
              {
                "at": "2026-10-04T00:00:00Z",
                "status": "next-task",
                "note": "Invitation loop initialized with INV-001 approved and ready for implementation."
              }
            ]
          }
          JSON

      - name: Install Invitation AntiSlop gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/invitation-antislop.yml <<'EOF'
          name: Invitation AntiSlop

          on:
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pull-requests: read

          jobs:
            antislop:
              name: Invitation AntiSlop
              runs-on: ubuntu-latest
              steps:
                - name: Checkout trusted base
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.repository.default_branch || 'main' }}
                    persist-credentials: false

                - name: Checkout PR diff as data
                  if: ${{ github.event_name == 'pull_request' }}
                  env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REPO: ${{ github.repository }}
                    PR: ${{ github.event.pull_request.number }}
                  run: gh pr diff "$PR" --repo "$REPO" > /tmp/pr.diff

                - name: Run Invitation AntiSlop heuristics
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -f /tmp/pr.diff || : > /tmp/pr.diff

                    if grep -Ein '^\+[^+].*(TODO|FIXME|lorem ipsum|coming soon|your text here|replace me|placeholder text)' /tmp/pr.diff; then
                      echo "::error::AntiSlop found placeholder or unfinished content."
                      exit 1
                    fi

                    if grep -Ein '^\+[^+].*(glassmorphism|backdrop-blur|animate-bounce|animate-spin)' /tmp/pr.diff; then
                      echo "::error::AntiSlop found a likely generic/generated UI pattern."
                      exit 1
                    fi

                    echo "Invitation AntiSlop gate passed."
          EOF

      - name: Validate bootstrap output
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            .ai/loop.config.json
            .ai/state/task-queue.json
            .ai/state/loop-state.json
            .ai/state/review-log.jsonl
            docs/tasks/INV-001.md
            .github/workflows/invitation-antislop.yml
          )

          for f in "${required_files[@]}"; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

          node -e "JSON.parse(require('fs').readFileSync('.ai/loop.config.json','utf8')); JSON.parse(require('fs').readFileSync('.ai/state/task-queue.json','utf8')); JSON.parse(require('fs').readFileSync('.ai/state/loop-state.json','utf8'));"

          grep -q '"id": "INV-001"' .ai/state/task-queue.json
          grep -q '"status": "approved"' .ai/state/task-queue.json
          grep -q '"loopId": "INV-001"' .ai/loop.config.json

          # Validate imported/generated files only. The bootstrap file is excluded
          # because it must contain the source repo URL used for the import itself.
          generated_files=(
            .ai
            .github/workflows/ai-loop-implement.yml
            .github/workflows/ai-loop-review.yml
            .github/workflows/ai-loop-next-task.yml
            .github/workflows/ai-loop-merge-gate.yml
            .github/workflows/ai-loop-validate.yml
            .github/workflows/invitation-antislop.yml
          )

          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'Badminton' "${generated_files[@]}"; then
            echo "::error::Imported Invitation automation still contains a Badminton reference."
            exit 1
          fi


          echo "Invitation bootstrap validation passed."

      - name: Validate generated loop configuration and workflows
        shell: bash
        run: |
          set -euo pipefail
          test -f .ai/scripts/validate-loop-config.mjs
          test -f .ai/scripts/validate-workflows.mjs
          node .ai/scripts/validate-loop-config.mjs
          node .ai/scripts/validate-workflows.mjs

      - name: Commit bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Invitation Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai .github/workflows/ai-loop-*.yml .github/workflows/invitation-antislop.yml docs/tasks/INV-001.md

          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi

          git commit -m "chore: bootstrap Invitation autonomous AI loop v4"
          git push origin HEAD:main
