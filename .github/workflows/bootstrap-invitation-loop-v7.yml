name: Bootstrap Invitation AI Loop v7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Bootstrap Invitation automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Invitation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Invitation Automation"
          git config user.email "automation@users.noreply.github.com"

      - name: Clone proven loop source
        run: |
          git clone --depth 1 https://github.com/ngowda759/Badminton.git _badminton-loop-source

      - name: Import automation engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ai
          mkdir -p .ai

          cp -R _badminton-loop-source/.ai/scripts .ai/
          cp -R _badminton-loop-source/.ai/prompts .ai/
          cp -R _badminton-loop-source/.ai/schemas .ai/
          cp -R _badminton-loop-source/.ai/templates .ai/

          for wf in \
            ai-loop-implement.yml \
            ai-loop-review.yml \
            ai-loop-next-task.yml \
            ai-loop-merge-gate.yml \
            ai-loop-validate.yml
          do
            cp "_badminton-loop-source/.github/workflows/$wf" ".github/workflows/$wf"
          done

          find .ai .github/workflows \
            -type f \
            \( -name '*.mjs' -o -name '*.json' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' \) \
            -print0 |
          xargs -0 -r perl -0pi -e '
            s/ngowda759\/Badminton/ngowda759\/Invitation/g;
            s/Badminton/Invitation/g;
            s/AI-([0-9][0-9]*)/INV-$1/g;
            s/AI-/INV-/g;
          '

          rm -rf _badminton-loop-source

      - name: Create Invitation loop configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai/state docs/tasks

          cat > .ai/loop.config.json <<'JSON'
          {
            "version": 1,
            "loopId": "INV-001",
            "maxReviewRounds": 3,
            "baseBranch": "main",
            "branchPrefix": "automation/",
            "ciWorkflow": "CI",
            "ciWorkflowFile": ".github/workflows/ci.yml",
            "requiredChecks": [
              "Lint, typecheck, test, build",
              "Invitation AntiSlop"
            ],
            "protectedPaths": [
              ".github/workflows/ci.yml",
              ".github/workflows/**",
              ".env",
              ".env.*",
              "docs/constitution.md"
            ],
            "secrets": {
              "required": [
                "OPENHANDS_API_KEY",
                "OPENROUTER_API_KEY"
              ],
              "optional": [
                "OPENHANDS_HOST",
                "OPENROUTER_REVIEW_MODEL"
              ],
              "note": "GITHUB_TOKEN is provided by GitHub Actions and must never be committed. OPENHANDS_HOST and OPENROUTER_REVIEW_MODEL are Actions variables. OPENROUTER_API_KEY is the reviewer credential; OPENHANDS_API_KEY is the implementer credential."
            },
            "review": {
              "provider": "openrouter",
              "endpoint": "https://openrouter.ai/api/v1",
              "model": "openrouter/free",
              "apiKeyEnvVar": "OPENROUTER_API_KEY",
              "modelEnvVar": "OPENROUTER_REVIEW_MODEL",
              "schema": ".ai/schemas/review-report.schema.json",
              "markerName": "ai-loop-review",
              "commentOnEveryRound": true
            },
            "mergeGate": {
              "enabled": true,
              "requireCiGreen": true,
              "requireReviewPassed": true,
              "requireHumanApproval": false
            },
            "reviewers": {
              "architect": "ChatGPT",
              "implementer": "OpenHands",
              "ci": "GitHub Actions",
              "merge": "GitHub Actions"
            },
            "automation": {
              "enabled": true,
              "autoAdvanceTasks": true,
              "autoMerge": true,
              "maxConcurrentTasks": 1,
              "nextTaskEnabled": true,
              "stopOnHumanReviewRequired": true,
              "stopOnProtectedPath": true,
              "triggerLabel": "ai-task",
              "reviewLabel": "ai-review",
              "blockedLabel": "ai-blocked",
              "readyLabel": "ai-ready",
              "nextTaskBranchPrefix": "automation/next-task-",
              "mergeMethod": "squash",
              "useNativeAutoMerge": true
            },
            "limits": {
              "maxChangedFiles": 60,
              "maxDiffLines": 2500
            },
            "paths": {
              "state": ".ai/state/loop-state.json",
              "queue": ".ai/state/task-queue.json",
              "reviewLog": ".ai/state/review-log.jsonl",
              "taskDocs": "docs/tasks"
            }
          }
          JSON

          : > .ai/state/review-log.jsonl

          cat > .ai/state/loop-state.json <<'JSON'
          {
            "version": 1,
            "loopId": "INV-001",
            "status": "next-task",
            "round": 0,
            "maxReviewRounds": 3,
            "currentTaskId": null,
            "currentPr": null,
            "lastVerdict": null,
            "lastCiStatus": null,
            "reviewedHeadSha": null,
            "blockedReason": null,
            "completedTasks": [],
            "updatedAt": "2026-01-01T00:00:00Z",
            "history": [
              {
                "at": "2026-01-01T00:00:00Z",
                "status": "next-task",
                "note": "Invitation loop infrastructure bootstrapped; awaiting the first implementation task."
              }
            ]
          }
          JSON

          cat > .ai/state/task-queue.json <<'JSON'
          {
            "version": 1,
            "updatedAt": "2026-01-01T00:00:00Z",
            "tasks": [
              {
                "id": "INV-001",
                "title": "Initialize Application Foundation",
                "phase": "P1 Foundation",
                "status": "approved",
                "summary": "Establish the production-ready Next.js application foundation for Invitation without implementing product features yet.",
                "acceptanceCriteria": [
                  "Create the Next.js App Router application with TypeScript.",
                  "Establish the Tailwind CSS and shadcn/ui foundation.",
                  "Establish clean project structure, linting and formatting.",
                  "Add Vitest and Playwright foundations.",
                  "Add a responsive mobile-first base layout.",
                  "Add metadata and SEO foundation.",
                  "Add application CI for lint, typecheck, test and build.",
                  "Do not add database, authentication, Rayaramathaynk runtime APIs, Raya AI, hero animation or complex application state."
                ],
                "outOfScope": [
                  "Hero implementation",
                  "Opening animation",
                  "Temple content",
                  "Database",
                  "Authentication",
                  "Rayaramathaynk runtime APIs",
                  "Raya AI",
                  "Complex application state"
                ],
                "humanApproval": false,
                "dependsOn": [],
                "references": [
                  "docs/constitution.md",
                  "docs/PRODUCT.md",
                  "docs/ARCHITECTURE.md",
                  "docs/DESIGN-SYSTEM.md",
                  "docs/PHASES.md",
                  "docs/QUALITY-GATES.md",
                  "docs/AGENT-CONTRACT.md"
                ],
                "createdAt": "2026-01-01T00:00:00Z"
              }
            ]
          }
          JSON

          cat > docs/tasks/INV-001.md <<'EOF'
          # INV-001 — Initialize Application Foundation

          ## Objective

          Establish the production-ready application foundation for Invitation.

          ## Scope

          - Next.js App Router with TypeScript
          - Tailwind CSS and shadcn/ui foundation
          - Clean project structure
          - ESLint and formatting
          - Vitest and Playwright foundations
          - Responsive mobile-first base layout
          - Metadata and SEO foundation
          - GitHub CI for lint, typecheck, test and build

          ## Explicitly out of scope

          - Hero implementation
          - Opening animation
          - Temple content
          - Database
          - Authentication
          - Rayaramathaynk runtime APIs
          - Raya AI
          - Complex application state

          ## Acceptance

          - Application installs with `npm ci`
          - Lint passes
          - Typecheck passes
          - Tests pass
          - Production build passes
          - Mobile-first base layout exists
          - No fabricated temple facts are introduced
          - Changes are delivered through a PR, not directly to main
          EOF

      - name: Ensure existing CI has explicit permissions
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/workflows/ci.yml

          if ! grep -Eq '^[[:space:]]*permissions:[[:space:]]*$' .github/workflows/ci.yml; then
            tmp="$(mktemp)"
            awk '
              BEGIN { inserted=0 }
              /^name:/ && inserted==0 {
                print
                print ""
                print "permissions:"
                print "  contents: read"
                inserted=1
                next
              }
              { print }
            ' .github/workflows/ci.yml > "$tmp"
            mv "$tmp" .github/workflows/ci.yml
          fi

          grep -Eq '^[[:space:]]*permissions:[[:space:]]*$' .github/workflows/ci.yml

      - name: Create Invitation AntiSlop gate
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/workflows/invitation-antislop.yml <<'YAML'
          name: Invitation AntiSlop

          on:
            pull_request:
              branches:
                - main

          permissions:
            contents: read
            pull-requests: read

          jobs:
            antislop:
              name: Invitation quality gate
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Check project boundaries
                  shell: bash
                  run: |
                    set -euo pipefail
                    if grep -RIn --exclude-dir=.git --exclude='bootstrap-invitation-loop-v*.yml' \
                      -E 'ngowda759/Rayaramathaynk|Rayaramathaynk AI|Raya AI' \
                      .ai .github docs README.md 2>/dev/null; then
                      echo "Forbidden Rayaramathaynk runtime dependency/reference detected."
                      exit 1
                    fi

                - name: Check obvious placeholder content
                  shell: bash
                  run: |
                    set -euo pipefail
                    if grep -RIn --exclude-dir=.git \
                      -E 'TODO[[:space:]]*:[[:space:]]*AI|lorem ipsum|PLACEHOLDER_CONTENT' \
                      app src components pages 2>/dev/null; then
                      echo "Obvious placeholder/slop content detected."
                      exit 1
                    fi
          YAML

      - name: Validate generated automation
        shell: bash
        run: |
          set -euo pipefail

          test -f .ai/loop.config.json
          test -f .ai/state/loop-state.json
          test -f .ai/state/task-queue.json
          test -f .ai/state/review-log.jsonl
          test -f docs/tasks/INV-001.md
          test -f .github/workflows/invitation-antislop.yml

          node .ai/scripts/validate-loop-config.mjs
          node .ai/scripts/validate-workflows.mjs

          if grep -RIn --exclude-dir=.git \
            -E 'ngowda759/Badminton|Badminton' \
            .ai \
            .github/workflows/ai-loop-implement.yml \
            .github/workflows/ai-loop-review.yml \
            .github/workflows/ai-loop-next-task.yml \
            .github/workflows/ai-loop-merge-gate.yml \
            .github/workflows/ai-loop-validate.yml; then
            echo "Generated Invitation automation still contains Badminton references."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.ai/loop.config.json', 'utf8'));
          const state = JSON.parse(fs.readFileSync('.ai/state/loop-state.json', 'utf8'));
          const queue = JSON.parse(fs.readFileSync('.ai/state/task-queue.json', 'utf8'));

          if (config.loopId !== 'INV-001') throw new Error('Unexpected loopId');
          if (state.loopId !== 'INV-001') throw new Error('Unexpected state loopId');
          if (state.maxReviewRounds !== config.maxReviewRounds) throw new Error('Review round mismatch');
          if (queue.tasks.length !== 1 || queue.tasks[0].id !== 'INV-001') throw new Error('Unexpected task queue');
          if (queue.tasks[0].status !== 'approved') throw new Error('INV-001 must start approved');
          if ('taskIdPrefix' in config) throw new Error('taskIdPrefix must not exist');
          if (!config.paths || !config.paths.state || !config.paths.queue || !config.paths.reviewLog || !config.paths.taskDocs) {
            throw new Error('Required config.paths entries are missing');
          }
          NODE

      - name: Commit bootstrap
        shell: bash
        run: |
          set -euo pipefail

          git add .ai .github/workflows docs/tasks/INV-001.md

          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi

          git commit -m "chore: bootstrap Invitation autonomous AI loop v7"
          git push origin main
