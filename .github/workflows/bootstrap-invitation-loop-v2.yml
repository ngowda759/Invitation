```yaml
name: Bootstrap Invitation AI Loop v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Invitation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import loop engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _badminton-loop-source

          git clone \
            --depth 1 \
            https://github.com/ngowda759/Badminton.git \
            _badminton-loop-source

          mkdir -p \
            .ai/scripts \
            .ai/prompts \
            .ai/schemas \
            .ai/templates \
            .ai/tests \
            .ai/state \
            docs/tasks

          cp -R _badminton-loop-source/.ai/scripts/. .ai/scripts/
          cp -R _badminton-loop-source/.ai/prompts/. .ai/prompts/
          cp -R _badminton-loop-source/.ai/schemas/. .ai/schemas/
          cp -R _badminton-loop-source/.ai/templates/. .ai/templates/

          for workflow in \
            ai-loop-implement.yml \
            ai-loop-review.yml \
            ai-loop-next-task.yml \
            ai-loop-merge-gate.yml \
            ai-loop-validate.yml
          do
            cp \
              "_badminton-loop-source/.github/workflows/${workflow}" \
              ".github/workflows/${workflow}"
          done

          echo "Loop engine imported."

      - name: Adapt loop engine for Invitation
        shell: bash
        run: |
          set -euo pipefail

          find \
            .ai \
            .github/workflows \
            -type f \
            \( \
              -name '*.mjs' \
              -o -name '*.json' \
              -o -name '*.md' \
              -o -name '*.yml' \
              -o -name '*.yaml' \
            \) \
            -print0 |
            xargs -0 -r sed -i \
              -e 's/ngowda759\/Badminton/ngowda759\/Invitation/g' \
              -e 's/Badminton/Invitation/g' \
              -e 's/AI-/INV-/g'

          rm -rf _badminton-loop-source

          echo "Loop engine adapted for Invitation."

      - name: Write Invitation loop configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > .ai/loop.config.json <<'JSON'
          {
            "version": 1,
            "loopId": "INV-001",
            "maxReviewRounds": 3,
            "baseBranch": "main",
            "branchPrefix": "automation/",
            "ciWorkflow": "CI",
            "ciWorkflowFile": ".github/workflows/ci.yml",
            "requiredChecks": [
              "Lint, typecheck, test, build",
              "Invitation AntiSlop"
            ],
            "protectedPaths": [
              ".github/workflows/**",
              ".env",
              ".env.*",
              "docs/PRODUCT.md",
              "docs/ARCHITECTURE.md",
              "docs/DESIGN-SYSTEM.md",
              "docs/PHASES.md",
              "docs/QUALITY-GATES.md",
              "docs/AGENT-CONTRACT.md"
            ],
            "secrets": {
              "required": [
                "OPENHANDS_API_KEY",
                "OPENROUTER_API_KEY"
              ],
              "optional": [
                "OPENHANDS_HOST",
                "OPENROUTER_REVIEW_MODEL"
              ]
            },
            "review": {
              "provider": "openrouter",
              "endpoint": "https://openrouter.ai/api/v1",
              "model": "openrouter/free",
              "apiKeyEnvVar": "OPENROUTER_API_KEY",
              "modelEnvVar": "OPENROUTER_REVIEW_MODEL",
              "schema": ".ai/schemas/review-report.schema.json",
              "markerName": "ai-loop-review",
              "commentOnEveryRound": true
            },
            "mergeGate": {
              "enabled": true,
              "requireCiGreen": true,
              "requireReviewPassed": true,
              "requireHumanApproval": false
            },
            "reviewers": {
              "architect": "ChatGPT",
              "implementer": "OpenHands",
              "reviewer": "OpenRouter",
              "qualityGate": "Invitation AntiSlop",
              "ci": "GitHub Actions",
              "merge": "GitHub Actions"
            },
            "automation": {
              "enabled": true,
              "autoAdvanceTasks": true,
              "autoMerge": true,
              "maxConcurrentTasks": 1,
              "nextTaskEnabled": true,
              "stopOnHumanReviewRequired": true,
              "stopOnProtectedPath": true,
              "triggerLabel": "ai-task",
              "reviewLabel": "ai-review",
              "blockedLabel": "ai-blocked",
              "readyLabel": "ai-ready",
              "nextTaskBranchPrefix": "automation/next-task-",
              "mergeMethod": "squash",
              "useNativeAutoMerge": true
            },
            "limits": {
              "maxChangedFiles": 60,
              "maxDiffLines": 2500
            },
            "paths": {
              "state": ".ai/state/loop-state.json",
              "queue": ".ai/state/task-queue.json",
              "reviewLog": ".ai/state/review-log.jsonl",
              "taskDocs": "docs/tasks"
            }
          }
          JSON

          echo "Loop configuration written."

      - name: Write initial task
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/tasks

          cat > docs/tasks/INV-001.md <<'EOF'
          # INV-001 — Initialize Application Foundation

          ## Phase

          P1 Foundation

          ## Objective

          Establish the production-ready Next.js foundation for
          Rayara Anubhava without implementing later invitation experiences.

          ## Scope

          - Next.js App Router + TypeScript.
          - Tailwind CSS and agreed UI foundation.
          - Documented project structure.
          - ESLint and formatting.
          - Vitest foundation.
          - Playwright foundation.
          - Responsive base layout.
          - Metadata and SEO foundation.
          - GitHub CI.

          ## Acceptance criteria

          - Application starts successfully.
          - Application builds successfully.
          - TypeScript validation works.
          - ESLint works.
          - Unit-test foundation works.
          - Playwright foundation works.
          - CI validates lint, typecheck, test and build.
          - Mobile-first layout foundation exists.
          - No database is introduced.
          - No authentication is introduced.
          - No Rayaramathaynk runtime dependency is introduced.
          - No Raya AI integration is introduced.
          - No later-phase invitation feature is introduced.
          - No fabricated temple-specific content is introduced.

          ## Out of scope

          - Hero experience.
          - Programme/event content.
          - Temple map.
          - Gallery.
          - Seva content.
          - Audio.
          - Backend/API.
          - Authentication.
          - Database.

          ## Validation

          - npm run lint
          - npm run typecheck
          - npm test
          - npm run build
          - Playwright smoke test if configured.

          ## References

          - docs/ARCHITECTURE.md
          - docs/DESIGN-SYSTEM.md
          - docs/PHASES.md
          - docs/QUALITY-GATES.md
          - docs/AGENT-CONTRACT.md
          EOF

      - name: Write loop state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ai/state

          : > .ai/state/review-log.jsonl

          cat > .ai/state/task-queue.json <<'JSON'
          {
            "version": 1,
            "updatedAt": "2026-10-04T00:00:00Z",
            "tasks": [
              {
                "id": "INV-001",
                "title": "Initialize Application Foundation",
                "phase": "P1 Foundation",
                "status": "approved",
                "summary": "Initialize the Invitation application foundation according to the project constitution.",
                "acceptanceCriteria": [
                  "Next.js App Router + TypeScript foundation exists.",
                  "Tailwind CSS and the agreed UI foundation are configured.",
                  "The documented project structure exists.",
                  "Lint, typecheck, tests and build are wired into CI.",
                  "No database, authentication, Rayaramathaynk runtime dependency, or later-phase experience is introduced."
                ],
                "outOfScope": [
                  "Hero experience",
                  "Programme/event content",
                  "Temple map",
                  "Gallery",
                  "Seva content",
                  "Audio",
                  "Backend/API",
                  "Authentication",
                  "Database"
                ],
                "humanApproval": false,
                "dependsOn": [],
                "references": [
                  "docs/ARCHITECTURE.md",
                  "docs/DESIGN-SYSTEM.md",
                  "docs/PHASES.md",
                  "docs/QUALITY-GATES.md",
                  "docs/AGENT-CONTRACT.md"
                ],
                "createdAt": "2026-10-04T00:00:00Z"
              }
            ]
          }
          JSON

          cat > .ai/state/loop-state.json <<'JSON'
          {
            "version": 1,
            "loopId": "INV-001",
            "status": "next-task",
            "round": 0,
            "maxReviewRounds": 3,
            "currentTaskId": null,
            "currentPr": null,
            "lastVerdict": null,
            "lastCiStatus": null,
            "reviewedHeadSha": null,
            "blockedReason": null,
            "completedTasks": [],
            "updatedAt": "2026-10-04T00:00:00Z",
            "history": [
              {
                "at": "2026-10-04T00:00:00Z",
                "status": "next-task",
                "note": "Invitation loop initialized with INV-001 approved and ready for implementation."
              }
            ]
          }
          JSON

      - name: Install Invitation AntiSlop
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/workflows/invitation-antislop.yml <<'EOF'
          name: Invitation AntiSlop

          on:
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read
            pull-requests: read

          jobs:
            antislop:
              name: Invitation AntiSlop
              runs-on: ubuntu-latest

              steps:
                - name: Checkout trusted base
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.repository.default_branch || 'main' }}
                    persist-credentials: false

                - name: Collect PR diff
                  if: ${{ github.event_name == 'pull_request' }}
                  env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REPO: ${{ github.repository }}
                    PR: ${{ github.event.pull_request.number }}
                  run: |
                    gh pr diff "$PR" --repo "$REPO" > /tmp/pr.diff

                - name: Run AntiSlop checks
                  shell: bash
                  run: |
                    set -euo pipefail

                    test -f /tmp/pr.diff || : > /tmp/pr.diff

                    if grep -Ein \
                      'TODO|FIXME|lorem ipsum|coming soon|your text here|replace me|placeholder text' \
                      /tmp/pr.diff
                    then
                      echo "::error::AntiSlop found unfinished or placeholder content."
                      exit 1
                    fi

                    if grep -Ein \
                      'glassmorphism|backdrop-blur|animate-bounce|animate-spin' \
                      /tmp/pr.diff
                    then
                      echo "::error::AntiSlop found a prohibited generic UI pattern."
                      exit 1
                    fi

                    echo "Invitation AntiSlop passed."
          EOF

      - name: Install Invitation CI
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
              branches:
                - main
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            quality:
              name: Lint, typecheck, test, build
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install
                  run: npm ci

                - name: Lint
                  run: npm run lint

                - name: Typecheck
                  run: npm run typecheck

                - name: Test
                  run: npm test

                - name: Build
                  run: npm run build
          EOF

      - name: Validate bootstrap
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required files..."

          test -f .ai/loop.config.json
          test -f .ai/state/task-queue.json
          test -f .ai/state/loop-state.json
          test -f .ai/state/review-log.jsonl
          test -f docs/tasks/INV-001.md

          test -f .github/workflows/ai-loop-implement.yml
          test -f .github/workflows/ai-loop-review.yml
          test -f .github/workflows/ai-loop-next-task.yml
          test -f .github/workflows/ai-loop-merge-gate.yml
          test -f .github/workflows/ai-loop-validate.yml
          test -f .github/workflows/invitation-antislop.yml
          test -f .github/workflows/ci.yml

          echo "Checking Invitation task..."

          grep -q '"id": "INV-001"' \
            .ai/state/task-queue.json

          grep -q '"status": "approved"' \
            .ai/state/task-queue.json

          grep -q '"loopId": "INV-001"' \
            .ai/state/loop-state.json

          echo "Checking for Badminton leakage..."

          if grep -RIn \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            'Badminton' \
            .ai \
            .github/workflows
          then
            echo "::error::Badminton-specific reference detected."
            exit 1
          fi

          echo "Checking for broken repository references..."

          if grep -RIn \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            'ngowda759/Badminton' \
            .ai \
            .github/workflows
          then
            echo "::error::Badminton repository reference detected."
            exit 1
          fi

          echo "Invitation bootstrap validation PASSED."

      - name: Commit bootstrap
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Invitation Automation"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .ai \
            .github/workflows \
            docs/tasks/INV-001.md

          if git diff --cached --quiet
          then
            echo "No bootstrap changes detected."
            exit 0
          fi

          git commit \
            -m "chore: bootstrap Invitation autonomous AI loop v2"

          git push origin HEAD:main
```
